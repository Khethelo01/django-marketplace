{% extends "base.html" %}{% block content %}<h1>{{ store.name }}</h1><p>{{ store.description }}</p><div class="grid">{% for product in store.products.all %}<article class="item"><h2><a href="{% url 'product' product.pk %}">{{ product.name }}</a></h2><p>{{ product.description }}</p><p>R{{ product.price }}</p></article>{% empty %}<p>This store has no products yet.</p>{% endfor %}</div>{% endblock %}
